<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" role="img" aria-label="Resultados experimentais selecionados: waves C104, layout C293 e reuso C274 com âmbitos e limites">
<rect width="1280" height="510" fill="#fafcff"/>
<text x="38" y="49" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#14223a">Tesy — melhorias internas do percurso de execução</text>
<text x="39" y="79" font-family="Arial,sans-serif" font-size="16" fill="#5b6880">Reduções de duração, não somáveis e de workloads diferentes. Dados de C104, C293, C274 e C282.</text>
<rect x="38" y="112" width="390" height="306" rx="15" fill="#e3f5f1"/>
<text x="61" y="149" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#14223a">Wave skip · C104</text>
<text x="62" y="182" font-family="Arial,sans-serif" font-size="15" fill="#53637c">OFF/ON no mesmo executável C75</text>
<text x="62" y="236" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#008e86">−75,35%</text>
<text x="62" y="263" font-family="Arial,sans-serif" font-size="16" fill="#14223a">prefill frio</text>
<text x="62" y="323" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#315fac">−27,72%</text>
<text x="62" y="347" font-family="Arial,sans-serif" font-size="16" fill="#14223a">prefill incremental</text>
<text x="62" y="394" font-family="Arial,sans-serif" font-size="14" fill="#5b6880">Dois pares; C100 limita a generalização.</text>
<rect x="446" y="112" width="390" height="306" rx="15" fill="#e9f0fc"/>
<text x="469" y="149" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#14223a">Layout lossless · C293</text>
<text x="470" y="182" font-family="Arial,sans-serif" font-size="15" fill="#53637c">Mesmos pesos, routing e slots</text>
<text x="470" y="236" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#315fac">−7,47%</text>
<text x="470" y="263" font-family="Arial,sans-serif" font-size="16" fill="#14223a">custo total · nominal</text>
<text x="470" y="323" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#315fac">−6,05%</text>
<text x="470" y="347" font-family="Arial,sans-serif" font-size="16" fill="#14223a">custo total · código</text>
<text x="470" y="394" font-family="Arial,sans-serif" font-size="14" fill="#5b6880">Trabalho fornecido; full33 logits bitwise.</text>
<rect x="854" y="112" width="388" height="306" rx="15" fill="#fff3e1"/>
<text x="877" y="149" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#14223a">Reuso por tiles · C274</text>
<text x="878" y="182" font-family="Arial,sans-serif" font-size="15" fill="#53637c">Prototipagem experimental</text>
<text x="878" y="236" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#c57c25">−18,19%</text>
<text x="878" y="263" font-family="Arial,sans-serif" font-size="16" fill="#14223a">prefill · trabalho fornecido</text>
<text x="878" y="323" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#c57c25">−8,91%</text>
<text x="878" y="347" font-family="Arial,sans-serif" font-size="16" fill="#14223a">first-final · código livre</text>
<text x="878" y="394" font-family="Arial,sans-serif" font-size="14" fill="#8a5528">C282 encontrou regressão no decode nominal.</text>
<text x="40" y="454" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#14223a">Não demonstram superioridade global sobre runtime stock com recursos idênticos.</text>
<text x="40" y="481" font-family="Arial,sans-serif" font-size="15" fill="#5b6880">Mais slots consomem mais memória: não foram apresentados como inovação arquitetural.</text>
</svg>