[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tesy-runtime"
version = "0.1.0"
description = "Causal MoE residency research foundation; not a qualified optimized LLM runtime"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tesy = "tesy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
