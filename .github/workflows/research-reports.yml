name: Research reports documentation

on:
  pull_request:
    paths:
      - '.github/workflows/research-reports.yml'
      - 'docs/research-reports/**'
  push:
    branches:
      - 'docs/research-reports-*'
    paths:
      - '.github/workflows/research-reports.yml'
      - 'docs/research-reports/**'

jobs:
  evidence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/research-reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m unittest discover -s tests -q
      - name: Verify frozen reports
        run: |
          for report in C01-scale-lab C02-correctness-usability R00-foundations D00-research-dossier; do
            python tools/verify_evidence.py "$report" >/dev/null
          done
