name: Research reports documentation

on:
  pull_request:
  push:
    branches:
      - 'campaign/**'
      - 'docs/research-reports-*'

jobs:
  evidence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/research-reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m unittest discover -s tests -q
      - name: Verify frozen reports
        run: |
          for report in $(python -c 'import json; print(" ".join(r["id"] for r in json.load(open("registry.json"))["reports"]))'); do
            python tools/verify_evidence.py "$report" >/dev/null
          done
      - name: Require documentation for final campaigns
        run: python ci/check_campaign_coverage.py --repo ../..
