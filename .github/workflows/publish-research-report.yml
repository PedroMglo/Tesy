name: Publish reviewed research-report release

on:
  push:
    tags:
      - 'reports-*-v*'

permissions:
  contents: write

jobs:
  publish:
    name: Verify and publish reviewed PDF
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/research-reports
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends latexmk texlive-luatex texlive-latex-extra texlive-lang-portuguese texlive-science texlive-bibtex-extra biber
      - run: python -m pip install -r tools/requirements.txt
      - name: Resolve immutable release identity
        run: |
          python - "$RELEASE_TAG" <<'PY' >> "$GITHUB_ENV"
          import json
          import pathlib
          import sys

          tag = sys.argv[1]
          registry = json.loads(pathlib.Path("registry.json").read_text())
          reports = {item["id"]: item["path"] for item in registry["reports"]}
          matches = []
          for report_id, path in reports.items():
              metadata = json.loads((pathlib.Path(path) / "campaign.json").read_text())
              if tag == f"reports-{report_id}-v{metadata['version']}":
                  matches.append((report_id, metadata["version"]))
          if len(matches) != 1:
              raise SystemExit(f"RELEASE_TAG_MISMATCH_OR_AMBIGUOUS: {tag}")
          report_id, version = matches[0]
          print(f"REPORT_ID={report_id}")
          print(f"REPORT_VERSION={version}")
          PY
      - name: Refuse replacement of an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "RELEASE_ALREADY_EXISTS: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Build and verify the exact reviewed PDF
        run: |
          destination=$(python tools/build_report.py "$REPORT_ID" --mode release --check-reproducible)
          mkdir release-assets
          cp "$destination/report.pdf" "release-assets/${REPORT_ID}-v${REPORT_VERSION}.pdf"
          cp "$destination/release.json" release-assets/release.json
          cp "$destination/evidence-lock.json" release-assets/evidence-lock.json
          sha256sum release-assets/* > release-assets/SHA256SUMS
      - name: Create immutable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Tesy research report ${{ env.REPORT_ID }} v${{ env.REPORT_VERSION }}
          prerelease: false
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          body: |
            Publicação documental imutável gerada pelo workflow fail-closed do Tesy.
            Inclui PDF, manifesto de release, evidence lock e SHA-256 dos assets.
            Não é uma nova medição nem uma certificação fora do âmbito definido no relatório.
          files: docs/research-reports/release-assets/*
          fail_on_unmatched_files: true
