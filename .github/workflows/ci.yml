name: ci

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  history:
    name: Recover all inventoried branch heads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 research/consolidacao-20261123/verify.py

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
      - name: Verify the historical 44-slot prefill controller with model-free fixtures
        run: python -m unittest discover -s research/prefill44-replay
      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Parse locked JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("configs").glob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
              print(path)
          PY
      - name: Reproduce C320 receipts in the shallow checkout
        run: python research/post-c320/analyse.py > "$RUNNER_TEMP/post-c320.json"
      - name: Validate operational lab gates with model-free fixtures
        env:
          PYTHONPATH: tools
        run: >-
          python -m unittest -q test_host_resource_policy test_c143_optin_inventory test_c143_optin_stop
          test_r2_causal_gate test_expert_staging_gate test_expert_learned_staging_gate
          test_expert_staging_cost_gate test_expert_staging_product_cost_gate
      - name: CLI model-free smoke
        run: |
          tesy --help
          tesy models list
          tesy trace summarize tests/fixtures/routing-small.jsonl --windows 1,2
          tesy simulate             --trace tests/fixtures/routing-small.jsonl             --ram-cache-gib 0.000001             --vram-cache-gib 0.000001

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check benchmarks scripts src tests research --exclude results
      - name: Compile
        run: python -m compileall -q src tests tools research/post-c320 research/consolidacao-20261123
      - name: Validate manifests and shell syntax
        run: |
          python -m json.tool configs/backends.lock.json >/dev/null
          python -m json.tool configs/models.lock.json >/dev/null
          python -m json.tool configs/reference-host.json >/dev/null
          python -m json.tool configs/reference-llama-toolchain.json >/dev/null
          bash -n scripts/*.sh
      - name: Tests
        run: pytest -q

  native-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned llama.cpp
        run: |
          mkdir -p .deps
          git init .deps/llama.cpp
          git -C .deps/llama.cpp fetch --depth=1 https://github.com/ggml-org/llama.cpp.git 4e416ee7308dd6b581796f1a6241276cd5982691
          git -C .deps/llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C .deps/llama.cpp rev-parse HEAD)" = 4e416ee7308dd6b581796f1a6241276cd5982691
          test -z "$(git -C .deps/llama.cpp status --porcelain)"
      - name: Configure tracer
        run: |
          cmake -S native -B build/native-ci \
            -DLLAMA_CPP_SOURCE_DIR="$PWD/.deps/llama.cpp" \
            -DGGML_CUDA=OFF \
            -DCMAKE_BUILD_TYPE=Release
      - name: Compile integrated residency, tracer and model-free graph tests
        run: >-
          cmake --build build/native-ci --parallel 2 --target tesy-moe-trace tesy-mixed-residency
          tesy-split-graph-model-free tesy-sum-graph-model-free
          tesy-static-residency-model-free tesy-down-replay-model-free
      - name: Smoke tracer CLI
        run: build/native-ci/tesy-moe-trace --help
      - name: Split-graph MF0/MF1/MF2
        run: build/native-ci/tesy-split-graph-model-free
      - name: Leaf aggregation topology and execution
        run: build/native-ci/tesy-sum-graph-model-free
      - name: Static identity residency route partition
        run: build/native-ci/tesy-static-residency-model-free
      - name: Leaf-only down projection replay and slot mapping
        run: build/native-ci/tesy-down-replay-model-free
